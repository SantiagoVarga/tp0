name: tp0
services:
    server:
        container_name: server
        image: server:latest
        entrypoint: python3 /main.py
        environment:
            - PYTHONUNBUFFERED=1
        networks:
            - testing_net
        volumes:
            - ./server/config.ini:/config.ini
    client1:
        container_name: client1
        image: client:latest
        entrypoint: /client
        environment:
            - CLI_ID=1
            - NAME=name1
            - SURNAME=surname1
            - DNI=1001
            - BIRTHDAY=1990-01-01
            - NUMBER=101
        networks:
            - testing_net 
        depends_on:
            - server
        volumes:
            - ./client/config.yaml:/config.yaml
            - /home/santiago/Desktop/distribuidos/tp0/.data/agency-1.csv:/home/santiago/Desktop/distribuidos/tp0/.data/agency-1.csv
networks:
    testing_net:
        ipam:
            driver: default
            config:
               - subnet: 172.25.125.0/24
